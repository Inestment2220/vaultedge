<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qumovcoin Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh}
        .login-container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-box{background:#14141f;border:1px solid rgba(212,168,67,.2);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
        .logo{text-align:center;margin-bottom:30px}
        .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#d4a843,#b8912e);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin-bottom:16px}
        .logo h1{font-size:24px;font-weight:700;color:#f0ece4}
        .logo p{color:#7d7a8a;font-size:14px;margin-top:6px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:12px;font-weight:600;color:#7d7a8a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7d7a8a;font-size:14px}
        .input-wrapper input{width:100%;padding:14px 14px 14px 42px;background:#1a1a28;border:1px solid rgba(212,168,67,.1);border-radius:10px;color:#f0ece4;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .3s}
        .input-wrapper input:focus{border-color:#d4a843}
        .input-wrapper input::placeholder{color:rgba(125,122,138,.5)}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#d4a843,#b8912e);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
        .login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,168,67,.3)}
        .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .error-message{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.2);color:#e74c3c;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
        .error-message.show{display:block}
        .back-link{text-align:center;margin-top:20px}
        .back-link a{color:#d4a843;text-decoration:none;font-size:13px;font-weight:500}
        .back-link a:hover{text-decoration:underline}
        .dashboard{display:none}
        .dashboard.active{display:block}
        .header{background:#14141f;border-bottom:1px solid rgba(212,168,67,.1);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
        .header-left{display:flex;align-items:center;gap:12px}
        .header-left h2{font-size:18px;font-weight:700}
        .header-right{display:flex;gap:12px;align-items:center}
        .hdr-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;border:1px solid}
        .refresh-btn{background:rgba(212,168,67,.1);border-color:rgba(212,168,67,.2);color:#d4a843}
        .refresh-btn:hover{background:rgba(212,168,67,.2)}
        .logout-btn{background:rgba(231,76,60,.1);border-color:rgba(231,76,60,.2);color:#e74c3c}
        .logout-btn:hover{background:rgba(231,76,60,.2)}
        .content{padding:24px;max-width:1400px;margin:0 auto}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
        .stat-card{background:#14141f;border:1px solid rgba(212,168,67,.1);border-radius:12px;padding:20px}
        .stat-card .label{font-size:12px;color:#7d7a8a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
        .stat-card .value{font-size:26px;font-weight:700;color:#d4a843}
        .stat-card .value.green{color:#2ecc71}
        .stat-card .value.red{color:#e74c3c}
        .section{background:#14141f;border:1px solid rgba(212,168,67,.1);border-radius:12px;margin-bottom:24px;overflow:hidden}
        .section-header{padding:16px 20px;border-bottom:1px solid rgba(212,168,67,.1);font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
        .section-content{padding:0;overflow-x:auto}
        table{width:100%;border-collapse:collapse;min-width:700px}
        th,td{padding:12px 16px;text-align:left;border-bottom:1px solid rgba(212,168,67,.05)}
        th{font-size:11px;color:#7d7a8a;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
        td{font-size:13px}
        .status{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block}
        .status.pending{background:rgba(212,168,67,.1);color:#d4a843}
        .status.paid,.status.completed{background:rgba(46,204,113,.1);color:#2ecc71}
        .status.expired,.status.failed{background:rgba(231,76,60,.1);color:#e74c3c}
        .status.processing{background:rgba(52,152,219,.1);color:#3498db}
        .act-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(212,168,67,.2);background:rgba(212,168,67,.1);color:#d4a843;transition:all .2s;font-family:'Inter',sans-serif;margin:2px}
        .act-btn:hover{background:rgba(212,168,67,.2)}
        .act-btn.danger{border-color:rgba(231,76,60,.2);background:rgba(231,76,60,.1);color:#e74c3c}
        .act-btn.danger:hover{background:rgba(231,76,60,.2)}
        .act-btn.green{border-color:rgba(46,204,113,.2);background:rgba(46,204,113,.1);color:#2ecc71}
        .act-btn.green:hover{background:rgba(46,204,113,.2)}
        .empty-state{padding:40px;text-align:center;color:#7d7a8a}
        .loading{text-align:center;padding:40px;color:#7d7a8a}
        .spinner{width:30px;height:30px;border:3px solid rgba(212,168,67,.1);border-top-color:#d4a843;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .mono{font-family:monospace;font-size:11px;color:#7d7a8a;word-break:break-all;max-width:180px;display:inline-block}
        .truncate{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
        .toast-area{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 16px;border-radius:8px;font-size:13px;animation:toastIn .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.4)}
        .toast.ok{background:#14141f;border:1px solid rgba(46,204,113,.3);color:#2ecc71}
        .toast.err{background:#14141f;border:1px solid rgba(231,76,60,.3);color:#e74c3c}
        @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        @media(max-width:768px){.content{padding:16px}.stats-grid{grid-template-columns:1fr 1fr}.header{flex-direction:column;gap:12px;padding:12px 16px}.header-right{width:100%;justify-content:flex-end}}
        @media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="toast-area" id="toastArea"></div>

    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
                <h1>Admin Panel</h1>
                <p>Qumovcoin Management System</p>
            </div>
            <div class="error-message" id="errorMessage"></div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter admin password" autocomplete="current-password">
                </div>
            </div>
            <button class="login-btn" id="loginBtn" onclick="handleLogin()">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>
            <div class="back-link"><a href="/">← Back to Website</a></div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <div class="header-left">
                <i class="fas fa-shield-halved" style="color:#d4a843;font-size:20px"></i>
                <h2>Qumovcoin Admin</h2>
            </div>
            <div class="header-right">
                <button class="hdr-btn refresh-btn" onclick="loadDashboard()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="hdr-btn logout-btn" onclick="handleLogout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>
        <div class="content">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="section">
                <div class="section-header"><span><i class="fas fa-users"></i> Users (<span id="userCount">0</span>)</span></div>
                <div class="section-content" id="usersContent"></div>
            </div>
            <div class="section">
                <div class="section-header"><span><i class="fas fa-arrow-down"></i> Invoices (<span id="invoiceCount">0</span>)</span></div>
                <div class="section-content" id="depositsContent"></div>
            </div>
            <div class="section">
                <div class="section-header"><span><i class="fas fa-arrow-up"></i> Withdrawals (<span id="withdrawalCount">0</span>)</span></div>
                <div class="section-content" id="withdrawalsContent"></div>
            </div>
        </div>
    </div>

<script>
var authToken=null;
var API_BASE=window.location.origin;

(function(){
    var token=sessionStorage.getItem('admin_token');
    if(token){authToken=token;showDashboard()}
    document.getElementById('password').addEventListener('keypress',function(e){if(e.key==='Enter')handleLogin()});
})();

function toast(m,t){
    var el=document.createElement('div');
    el.className='toast '+(t||'ok');
    el.textContent=m;
    document.getElementById('toastArea').appendChild(el);
    setTimeout(function(){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(function(){el.remove()},300)},3000);
}

function showError(m){var el=document.getElementById('errorMessage');el.textContent=m;el.classList.add('show')}
function hideError(){document.getElementById('errorMessage').classList.remove('show')}

async function handleLogin(){
    var password=document.getElementById('password').value;
    var btn=document.getElementById('loginBtn');
    hideError();
    if(!password){showError('Please enter the admin password');return}
    btn.disabled=true;
    btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';
    try{
        var res=await fetch(API_BASE+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password})});
        var data=await res.json();
        if(data.status==='success'&&data.data&&data.data.token){
            authToken=data.data.token;
            sessionStorage.setItem('admin_token',authToken);
            showDashboard();
        }else{
            showError(data.message||'Login failed');
        }
    }catch(e){
        console.error('Login error:',e);
        showError('Cannot connect to server. Make sure the server is running.');
    }finally{
        btn.disabled=false;
        btn.innerHTML='<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
    }
}

function handleLogout(){
    authToken=null;
    sessionStorage.removeItem('admin_token');
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('password').value='';
    hideError();
}

function showDashboard(){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('dashboard').classList.add('active');
    loadDashboard();
}

async function apiCall(endpoint,opts){
    var o=opts||{};
    var res=await fetch(API_BASE+endpoint,{
        ...o,
        headers:{'x-admin-key':authToken,...(o.headers||{})}
    });
    if(res.status===401){handleLogout();throw new Error('Session expired')}
    return await res.json();
}

async function loadDashboard(){
    try{
        var s=await apiCall('/api/admin/stats');
        if(s.status==='success')renderStats(s.data);
    }catch(e){console.error('Stats error:',e)}
    try{
        var u=await apiCall('/api/admin/users');
        if(u.status==='success')renderUsers(u.data);
    }catch(e){console.error('Users error:',e)}
    try{
        var d=await apiCall('/api/admin/invoices');
        if(d.status==='success')renderDeposits(d.data);
    }catch(e){console.error('Deposits error:',e)}
    try{
        var w=await apiCall('/api/admin/withdrawals');
        if(w.status==='success')renderWithdrawals(w.data);
    }catch(e){console.error('Withdrawals error:',e)}
}

function renderStats(d){
    document.getElementById('statsGrid').innerHTML=
        '<div class="stat-card"><div class="label">Total Users</div><div class="value">'+(d.users?d.users.total:0)+'</div></div>'+
        '<div class="stat-card"><div class="label">Deposits (USD)</div><div class="value green">$'+(d.deposits?d.deposits.totalUSD.toFixed(2):'0.00')+'</div></div>'+
        '<div class="stat-card"><div class="label">Withdrawals (USD)</div><div class="value red">$'+(d.withdrawals?d.withdrawals.totalUSD.toFixed(2):'0.00')+'</div></div>'+
        '<div class="stat-card"><div class="label">Profit (USD)</div><div class="value green">$'+(d.profit?d.profit.toFixed(2):'0.00')+'</div></div>'+
        '<div class="stat-card"><div class="label">Paid Invoices</div><div class="value">'+(d.deposits?d.deposits.paid:0)+'</div></div>'+
        '<div class="stat-card"><div class="label">Pending Withdrawals</div><div class="value">'+(d.withdrawals?d.withdrawals.pending:0)+'</div></div>';
}

function fmtDate(ts){
    if(!ts)return '-';
    var d=new Date(ts);
    return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function escHtml(s){
    if(!s)return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderUsers(users){
    document.getElementById('userCount').textContent=users?users.length:0;
    if(!users||!users.length){
        document.getElementById('usersContent').innerHTML='<div class="empty-state"><i class="fas fa-users" style="font-size:30px;opacity:.3;margin-bottom:12px;display:block"></i>No users registered yet.</div>';
        return;
    }
    var h='<table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Ref Code</th><th>Joined</th><th>Action</th></tr></thead><tbody>';
    for(var i=0;i<users.length;i++){
        var u=users[i];
        h+='<tr><td>'+escHtml(u.name)+'</td><td class="truncate">'+escHtml(u.email)+'</td><td>'+escHtml(u.phone||'-')+'</td><td class="mono">'+escHtml(u.refCode)+'</td><td>'+fmtDate(u.joined)+'</td><td><button class="act-btn danger" onclick="deleteUser(\''+escHtml(u.email)+'\')"><i class="fas fa-trash"></i> Delete</button></td></tr>';
    }
    h+='</tbody></table>';
    document.getElementById('usersContent').innerHTML=h;
}

async function deleteUser(email){
    if(!confirm('Delete user '+email+'? This cannot be undone.'))return;
    try{
        var r=await apiCall('/api/admin/users/'+encodeURIComponent(email),{method:'DELETE'});
        if(r.status==='success'){toast('User deleted','ok');loadDashboard()}
        else toast(r.message||'Delete failed','err');
    }catch(e){toast(e.message||'Error','err')}
}

function renderDeposits(invoices){
    document.getElementById('invoiceCount').textContent=invoices?invoices.length:0;
    if(!invoices||!invoices.length){
        document.getElementById('depositsContent').innerHTML='<div class="empty-state"><i class="fas fa-arrow-down" style="font-size:30px;opacity:.3;margin-bottom:12px;display:block"></i>No invoices yet.</div>';
        return;
    }
    var h='<table><thead><tr><th>Date</th><th>Email</th><th>Level</th><th>Amount (NGN)</th><th>Amount (USD)</th><th>Crypto</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    for(var i=0;i<invoices.length;i++){
        var inv=invoices[i];
        h+='<tr><td>'+fmtDate(inv.created)+'</td><td class="truncate">'+escHtml(inv.email)+'</td><td>L'+inv.level+'</td><td>'+(inv.amountNGN||0).toLocaleString()+'</td><td>$'+(inv.amountUSD||0).toFixed(2)+'</td><td>'+(inv.cryptoType||'-').toUpperCase()+'</td><td><span class="status '+(inv.status||'pending')+'">'+(inv.status||'pending')+'</span></td><td>';
        if(inv.status==='pending'){
            h+='<button class="act-btn green" onclick="updateInvoice(\''+escHtml(inv.txn_id)+'\',\'paid\')"><i class="fas fa-check"></i> Mark Paid</button> ';
            h+='<button class="act-btn danger" onclick="updateInvoice(\''+escHtml(inv.txn_id)+'\',\'expired\')"><i class="fas fa-times"></i> Expire</button>';
        }
        h+='</td></tr>';
    }
    h+='</tbody></table>';
    document.getElementById('depositsContent').innerHTML=h;
}

async function updateInvoice(txnId,status){
    if(!confirm('Change invoice '+txnId+' to '+status+'?'))return;
    try{
        var r=await apiCall('/api/admin/invoices/'+encodeURIComponent(txnId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})});
        if(r.status==='success'){toast('Invoice updated to '+status,'ok');loadDashboard()}
        else toast(r.message||'Update failed','err');
    }catch(e){toast(e.message||'Error','err')}
}

function renderWithdrawals(withdrawals){
    document.getElementById('withdrawalCount').textContent=withdrawals?withdrawals.length:0;
    if(!withdrawals||!withdrawals.length){
        document.getElementById('withdrawalsContent').innerHTML='<div class="empty-state"><i class="fas fa-arrow-up" style="font-size:30px;opacity:.3;margin-bottom:12px;display:block"></i>No withdrawals yet.</div>';
        return;
    }
    var h='<table><thead><tr><th>Date</th><th>Email</th><th>Name</th><th>Amount (NGN)</th><th>Amount (USD)</th><th>Crypto</th><th>Wallet</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
    for(var i=0;i<withdrawals.length;i++){
        var w=withdrawals[i];
        h+='<tr><td>'+fmtDate(w.created)+'</td><td class="truncate">'+escHtml(w.email)+'</td><td class="truncate">'+escHtml(w.userName||'-')+'</td><td>'+(w.amountNGN||0).toLocaleString()+'</td><td>$'+(w.amountUSD||0).toFixed(2)+'</td><td>'+(w.cryptoType||'-').toUpperCase()+'</td><td class="mono" title="'+escHtml(w.walletAddress||'')+'">'+escHtml((w.walletAddress||'').substring(0,16))+'...</td><td><span class="status '+(w.status||'pending')+'">'+(w.status||'pending')+'</span></td><td>';
        if(w.status==='processing'){
            h+='<button class="act-btn green" onclick="updateWithdrawal(\''+escHtml(w.withdrawal_id)+'\',\'completed\')"><i class="fas fa-check"></i> Complete</button> ';
            h+='<button class="act-btn danger" onclick="updateWithdrawal(\''+escHtml(w.withdrawal_id)+'\',\'failed\')"><i class="fas fa-times"></i> Fail</button>';
        }
        h+='</td></tr>';
    }
    h+='</tbody></table>';
    document.getElementById('withdrawalsContent').innerHTML=h;
}

async function updateWithdrawal(id,status){
    if(!confirm('Change withdrawal '+id+' to '+status+'?'))return;
    try{
        var r=await apiCall('/api/admin/withdrawals/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})});
        if(r.status==='success'){toast('Withdrawal updated to '+status,'ok');loadDashboard()}
        else toast(r.message||'Update failed','err');
    }catch(e){toast(e.message||'Error','err')}
}
</script>
</body>
</html>
